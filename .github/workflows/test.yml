name: test
run-name: ${{ github.head_ref || github.ref_name }}-animegodot-test

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: animegodot-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: AnimeGodot GUT Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Run GUT tests
        run: godot --headless --path . --script res://addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit
